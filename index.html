<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Counter Offer</title>
<style>
  :root {
    --bg: #0C0C0E;
    --surface: #18181B;
    --surface-2: #1F1F23;
    --border: #27272A;
    --text: #FAFAFA;
    --text-dim: #A1A1AA;
    --text-faint: #6B7280;
    --red: #E8372A;
    --red-dim: #3A1613;
    --green: #22C55E;
    --green-dim: #0F2A1B;
    --amber: #F5B942;
    --amber-dim: #2E2310;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
  }
  #app {
    max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg);
    display: flex; flex-direction: column;
  }
  #main { flex: 1; padding-bottom: 92px; }
  input {
    width: 100%; box-sizing: border-box; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    padding: 12px 14px; font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--red); }
  button { cursor: pointer; font-family: inherit; }
  .label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 8px; font-weight: 600;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  .spin { animation: spin 0.9s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .navbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px; display: flex; background: var(--surface);
    border-top: 1px solid var(--border); padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    gap: 6px;
  }
  .navbtn {
    flex: 1; background: none; border: none; display: flex; flex-direction: column;
    align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; color: var(--text-faint);
  }
  .navbtn.active { color: var(--red); background: var(--red-dim); }
  .navbtn span.label2 { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
  .thumb { position: relative; width: 68px; height: 68px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .thumb button {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--red); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .primary-btn {
    width: 100%; background: var(--red); border: none; color: #fff;
    padding: 14px 0; font-size: 14px; font-weight: 700; border-radius: 10px;
    letter-spacing: 0.01em;
  }
  .primary-btn:disabled { background: var(--surface-2); color: var(--text-faint); }
  .ghost-btn {
    width: 100%; background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); padding: 12px 0; font-size: 13px; font-weight: 600;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const state = {
  view: "home",
  photos: [],
  itemName: "",
  notes: "",
  ebayValue: "",
  apiUrl: localStorage.getItem("pawn_api_url") || "",
  showSettings: false,
  ebayStep: "form",
  jewelryStep: "menu", // menu | scrap | sellable
  gunsStep: "form", // form | offers
  gunItemName: "",
  gunNotes: "",
  gunRetail: "",
  spot: null, // { gold, silver, updatedAt }
  spotLoading: false,
  spotError: false,
  sellable: { metal: null, weightDwt: "", stones: [] },
  showMetalSettings: false,
  stoneIdCounter: 0,
  lookupState: "idle",
  compsCount: null,
  history: [],
};

function fmt(n) {
  if (isNaN(n)) return "$0";
  return "$" + Math.round(n).toLocaleString("en-US");
}

const ICON_EBAY = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12V6a2 2 0 0 1 2-2h6l8 8-8 8-8-8Z"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/></svg>`;
const ICON_GUN = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 14h9v-2.5h4.5V14H19v2h-1v2h-3v-2h-3.2L10 19H7v-3H5a2 2 0 0 1-2-2Z"/><path d="M12 11.5V8h3l2 3.5"/></svg>`;
const ICON_DIAMOND = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12l4 5-10 11L2 9Z"/><path d="M2 9h20M9 4l-3 5 6 11 6-11-3-5"/></svg>`;

// Scrap value = (spot / 20) * purity factor * payout * weight in DWT.
// Spot is price per troy ounce; dividing by 20 gives price per
// pennyweight (DWT), since 1 troy oz = 20 DWT.
const GOLD_PAYOUT = 0.98;
const GOLD_TIERS = [
  { key: "10k", label: "10kt", factor: 0.38 },
  { key: "14k", label: "14kt", factor: 0.54 },
  { key: "18k", label: "18kt", factor: 0.71 },
  { key: "22k", label: "22kt", factor: 0.88 },
  { key: "24k", label: "24kt", factor: 0.96 },
];
const SILVER_PAYOUT = 0.95;
const SILVER_TIERS = [
  { key: "925", label: "925 (Sterling)", factor: 0.75 },
  { key: "999", label: "999 (Fine)", factor: 0.87 },
];

// Sellable (retail resale) pricing: flat $/DWT by metal, and flat
// $/point (1 point = 0.01ct) for diamonds under 0.75ct. 0.75ct+ stones
// go to Rapaport wholesale, which isn't a free public data source, so
// those get entered manually.
const SELLABLE_METALS = [
  { key: "10k", label: "10kt Gold", rate: 135 },
  { key: "14k", label: "14kt Gold", rate: 180 },
  { key: "18k", label: "18kt Gold", rate: 230 },
  { key: "22k", label: "22kt Gold", rate: 280 },
  { key: "plat", label: "Platinum", rate: 100 },
  { key: "silver", label: "Silver", rate: 7 },
];
// Editable base prices, so staff can update them every six months
// without touching code. Falls back to the defaults above until
// something's been saved.
let sellableRates = {};
SELLABLE_METALS.forEach((m) => { sellableRates[m.key] = m.rate; });
try {
  const savedRates = JSON.parse(localStorage.getItem("pawn_sellable_rates") || "{}");
  Object.assign(sellableRates, savedRates);
} catch (e) {}

function saveMetalRates(newRates) {
  Object.assign(sellableRates, newRates);
  localStorage.setItem("pawn_sellable_rates", JSON.stringify(sellableRates));
}
const DIAMOND_TIERS = [
  { key: "cloudy", label: "Cloudy", rate: 1 },
  { key: "decent", label: "Decent", rate: 4 },
  { key: "perfect", label: "Near perfect", rate: 6 },
];
// Up to and including this weight, price per point by quality tier.
// Above it, switch to manual Rapaport-wholesale entry.
const RAPAPORT_THRESHOLD_CT = 1.0;

// Guns: sell price = new retail price (looked up at Academy, Bass Pro,
// etc.) x 0.8. Offer is a percentage of that sell price - same
// low/mid/high shape as eBay, so staff can lean toward "high" for a
// nicer gun, same as they already do elsewhere in the app.
const GUN_SELL_MULTIPLIER = 0.8;
const GUN_LOW_PCT = 0.35;
const GUN_MID_PCT = 0.5;
const GUN_HIGH_PCT = 0.7;
const ICON_SETTINGS = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>`;

function header() {
  const subtitle =
    state.view === "home" ? "Instant buy price, three ways" :
    state.view === "ebay" ? "eBay sold comps" :
    state.view === "guns" ? "Gun values" : "Jewelry values";
  return `
    <div style="padding:20px 20px 16px; border-bottom:1px solid var(--border);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${state.view !== "home" ? `<button id="backBtn" aria-label="Back" style="background:var(--surface); border:1px solid var(--border); border-radius:10px; width:34px; height:34px; color:var(--text); font-size:16px;">←</button>` : ""}
          <div>
            <div style="font-weight:800; font-size:20px; color:var(--text); letter-spacing:-0.01em;">Counter Offer</div>
            <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">${subtitle}</div>
          </div>
        </div>
        ${state.view === "ebay" ? `<button id="settingsBtn" aria-label="Settings" style="width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center;">${ICON_SETTINGS}</button>` : ""}
      </div>
      ${state.showSettings && state.view === "ebay" ? `
        <div style="margin-top:14px;">
          <div class="label">Comps server URL</div>
          <input id="apiUrlInput" value="${state.apiUrl}" placeholder="https://your-app-name.onrender.com" style="font-family:monospace; font-size:12px;" />
          <div style="font-size:11px; color:var(--text-faint); margin-top:6px;">The web address of your deployed comps server. Set this once.</div>
        </div>
      ` : ""}
    </div>
  `;
}

function homeScreen() {
  let html = `<div style="padding:28px 20px;">`;
  html += `
    <div style="text-align:center; padding:10px 0 26px;">
      <div style="font-size:13px; color:var(--text-faint);">Choose a category below to price an item</div>
    </div>
  `;
  if (state.history.length > 0) {
    html += `<div class="label">Recent items</div><div style="display:flex; flex-direction:column; gap:10px;">`;
    state.history.forEach(h => {
      html += `<div class="card" style="display:flex; align-items:center; gap:12px; padding:12px 14px;">
        <div style="flex:1; min-width:0;">
          <div style="color:var(--text); font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${h.itemName}</div>
          <div style="color:var(--text-faint); font-size:11px; margin-top:2px;">${h.date} · ${h.category} · base ${fmt(h.ebayValue)}</div>
        </div>
        <div style="font-size:13px; font-weight:700; color:var(--red);">${fmt(h.low)}–${fmt(h.high)}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `
      <div class="card" style="text-align:center; padding:36px 20px; color:var(--text-faint);">
        <div style="font-size:13px;">No items priced yet</div>
      </div>
    `;
  }
  html += `</div>`;
  return html;
}

function jewelryMenuScreen() {
  function optionCard(id, icon, title, subtitle) {
    return `
      <button id="${id}" class="card" style="width:100%; text-align:left; display:flex; align-items:center; gap:14px; margin-bottom:12px; background:var(--surface); border:1px solid var(--border); color:inherit;">
        <div style="width:44px; height:44px; border-radius:12px; background:var(--red-dim); color:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${icon}</div>
        <div>
          <div style="font-weight:700; font-size:14px; color:var(--text);">${title}</div>
          <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">${subtitle}</div>
        </div>
      </button>
    `;
  }
  return `
    <div style="padding:24px 20px;">
      ${optionCard("goScrap", ICON_DIAMOND, "Scrap Jewelry", "Gold and silver, priced by weight and live spot price")}
      ${optionCard("goSellable", ICON_DIAMOND, "Sellable Jewelry", "Price by metal and stones")}
    </div>
  `;
}

function scrapRow(tier, spotPerOz, payout) {
  const perDwt = spotPerOz ? (spotPerOz / 20) * tier.factor * payout : 0;
  return `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <div style="flex:1;">
        <div style="font-size:12px; color:var(--text-dim); font-weight:600; margin-bottom:4px;">${tier.label}</div>
        <input id="w_${tier.key}" data-key="${tier.key}" class="scrapWeight" placeholder="0 DWT" inputmode="decimal" style="font-size:14px;" />
      </div>
      <div style="width:90px; text-align:right;">
        <div style="font-size:10px; color:var(--text-faint); margin-bottom:4px;">value</div>
        <div id="v_${tier.key}" style="font-size:14px; font-weight:700; color:var(--text);">$0</div>
      </div>
    </div>
  `;
}

function scrapJewelryScreen() {
  if (state.spotLoading) {
    return `<div style="padding:60px 30px; text-align:center; color:var(--text-faint); font-size:13px;"><span class="spin">⟳</span> Loading live spot prices...</div>`;
  }
  if (state.spotError || !state.spot) {
    return `
      <div style="padding:40px 30px; text-align:center;">
        <div style="color:var(--red); font-size:13px; margin-bottom:14px;">Couldn't reach the spot price service.</div>
        <button id="retrySpotBtn" class="ghost-btn">Retry</button>
      </div>
    `;
  }
  const updated = new Date(state.spot.updatedAt);
  const updatedStr = updated.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  let html = `<div style="padding:20px 20px 32px;">`;
  html += `
    <div class="card" style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <div>
        <div style="font-size:11px; color:var(--text-faint); font-weight:600;">GOLD SPOT</div>
        <div style="font-size:18px; font-weight:800; color:var(--text);">$${state.spot.gold.toFixed(2)}/oz</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px; color:var(--text-faint); font-weight:600;">SILVER SPOT</div>
        <div style="font-size:18px; font-weight:800; color:var(--text);">$${state.spot.silver.toFixed(2)}/oz</div>
      </div>
    </div>
    <div style="font-size:11px; color:var(--text-faint); text-align:center; margin-bottom:20px;">Updated ${updatedStr} · <button id="refreshSpotBtn" style="background:none; border:none; color:var(--red); font-size:11px; font-weight:600; padding:0;">Refresh</button></div>
  `;

  html += `<div class="label">Gold (enter weight in DWT)</div>`;
  GOLD_TIERS.forEach((t) => { html += scrapRow(t, state.spot.gold, GOLD_PAYOUT); });

  html += `<div class="label" style="margin-top:18px;">Silver (enter weight in DWT)</div>`;
  SILVER_TIERS.forEach((t) => { html += scrapRow(t, state.spot.silver, SILVER_PAYOUT); });

  html += `
    <div class="card" style="margin-top:20px; display:flex; justify-content:space-between; align-items:center; border-color:var(--red);">
      <div style="font-weight:700; font-size:14px; color:var(--text);">Total value</div>
      <div id="scrapTotal" style="font-size:28px; font-weight:800; color:var(--red);">$0</div>
    </div>
  `;
  html += `</div>`;
  return html;
}

function recomputeScrapTotals() {
  if (!state.spot) return;
  let total = 0;
  GOLD_TIERS.forEach((t) => {
    const input = document.getElementById(`w_${t.key}`);
    const weight = parseFloat(input ? input.value : "0") || 0;
    const value = (state.spot.gold / 20) * t.factor * GOLD_PAYOUT * weight;
    total += value;
    const out = document.getElementById(`v_${t.key}`);
    if (out) out.textContent = fmt(value);
  });
  SILVER_TIERS.forEach((t) => {
    const input = document.getElementById(`w_${t.key}`);
    const weight = parseFloat(input ? input.value : "0") || 0;
    const value = (state.spot.silver / 20) * t.factor * SILVER_PAYOUT * weight;
    total += value;
    const out = document.getElementById(`v_${t.key}`);
    if (out) out.textContent = fmt(value);
  });
  const totalEl = document.getElementById("scrapTotal");
  if (totalEl) totalEl.textContent = fmt(total);
}

async function loadSpotPrices() {
  if (!state.apiUrl.trim()) {
    state.spotError = true;
    render();
    return;
  }
  state.spotLoading = true;
  state.spotError = false;
  render();
  try {
    const base = state.apiUrl.replace(/\/+$/, "");
    const res = await fetch(`${base}/api/spot`);
    const data = await res.json();
    if (!res.ok || data.gold == null) {
      state.spotError = true;
    } else {
      state.spot = data;
    }
  } catch (e) {
    state.spotError = true;
  }
  state.spotLoading = false;
  render();
}

function stoneRow(stone) {
  const carats = parseFloat(stone.carats) || 0;
  const needsRapaport = carats > RAPAPORT_THRESHOLD_CT;
  let tierButtons = "";
  DIAMOND_TIERS.forEach((t) => {
    const active = stone.tier === t.key;
    tierButtons += `<button class="stoneTierBtn" data-stone="${stone.id}" data-tier="${t.key}" style="flex:1; padding:8px 0; font-size:11px; font-weight:700; border-radius:8px; border:1px solid ${active ? "var(--red)" : "var(--border)"}; background:${active ? "var(--red-dim)" : "var(--surface-2)"}; color:${active ? "var(--red)" : "var(--text-dim)"};">${t.label}</button>`;
  });

  let bodyHtml;
  if (needsRapaport) {
    bodyHtml = `
      <div style="font-size:11px; color:var(--amber); margin-bottom:8px;">Over ${RAPAPORT_THRESHOLD_CT}ct - look up on Rapaport, enter the value below</div>
      <input class="stoneManualValue" data-stone="${stone.id}" value="${stone.manualValue}" placeholder="Rapaport value ($)" inputmode="decimal" style="font-size:14px; margin-bottom:10px;" />
    `;
  } else {
    bodyHtml = `<div style="display:flex; gap:6px; margin-bottom:10px;">${tierButtons}</div>`;
  }

  return `
    <div class="card" data-stone-row="${stone.id}" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:12px; color:var(--text-dim); font-weight:600;">Stone</div>
        <button data-remove-stone="${stone.id}" style="background:none; border:none; color:var(--text-faint); font-size:12px;">Remove</button>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <input class="stoneCarats" data-stone="${stone.id}" value="${stone.carats}" placeholder="Carat weight, e.g. 0.10" inputmode="decimal" style="font-size:14px; flex:2;" />
        <input class="stoneQty" data-stone="${stone.id}" value="${stone.qty}" placeholder="Qty" inputmode="numeric" style="font-size:14px; flex:1; text-align:center;" />
      </div>
      ${bodyHtml}
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <div style="font-size:11px; color:var(--text-faint);">value${(parseInt(stone.qty, 10) || 1) > 1 ? ` (×${stone.qty})` : ""}</div>
        <div id="sv_${stone.id}" style="font-size:16px; font-weight:800; color:var(--text);">$0</div>
      </div>
    </div>
  `;
}

function metalRatesSettingsPanel() {
  let html = `<div class="card" style="margin-bottom:20px;">`;
  html += `<div style="font-weight:700; font-size:13px; color:var(--text); margin-bottom:4px;">Edit base metal prices</div>`;
  html += `<div style="font-size:11px; color:var(--text-faint); margin-bottom:14px;">What you pay per DWT when selling. Update every 6 months or whenever prices change.</div>`;
  SELLABLE_METALS.forEach((m) => {
    html += `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <div style="flex:1; font-size:12px; color:var(--text-dim); font-weight:600;">${m.label}</div>
        <div style="position:relative; width:110px;">
          <span style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:13px;">$</span>
          <input class="metalRateInput" data-metal="${m.key}" value="${sellableRates[m.key]}" inputmode="decimal" style="padding-left:20px; text-align:right; font-size:13px;" />
        </div>
      </div>
    `;
  });
  html += `<button id="saveMetalRatesBtn" class="primary-btn" style="margin-top:8px;">Save prices</button>`;
  html += `</div>`;
  return html;
}

function sellableScreen() {
  const s = state.sellable;
  let html = `<div style="padding:20px 20px 32px;">`;

  html += `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div class="label" style="margin-bottom:0;">Metal</div>
      <button id="metalSettingsBtn" aria-label="Edit metal prices" style="width:30px; height:30px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center;">${ICON_SETTINGS}</button>
    </div>
  `;

  if (state.showMetalSettings) {
    html += metalRatesSettingsPanel();
  }

  html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px;">`;
  SELLABLE_METALS.forEach((m) => {
    const active = s.metal === m.key;
    html += `<button class="metalBtn" data-metal="${m.key}" style="padding:12px; text-align:left; border-radius:10px; border:1px solid ${active ? "var(--red)" : "var(--border)"}; background:${active ? "var(--red-dim)" : "var(--surface)"};">
      <div style="font-size:12px; font-weight:700; color:${active ? "var(--red)" : "var(--text)"};">${m.label}</div>
      <div style="font-size:11px; color:var(--text-faint); margin-top:2px;">$${sellableRates[m.key]}/DWT</div>
    </button>`;
  });
  html += `</div>`;

  if (s.metal) {
    const metalDef = SELLABLE_METALS.find((m) => m.key === s.metal);
    html += `
      <div style="margin-bottom:22px;">
        <div class="label">Weight (DWT)</div>
        <input id="sellableWeight" value="${s.weightDwt}" placeholder="0" inputmode="decimal" />
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <div style="font-size:11px; color:var(--text-faint);">${metalDef.label} value</div>
          <div id="metalValue" style="font-size:14px; font-weight:700; color:var(--text);">$0</div>
        </div>
      </div>
    `;
  }

  html += `<div class="label">Stones</div>`;
  s.stones.forEach((stone) => { html += stoneRow(stone); });
  html += `<button id="addStoneBtn" class="ghost-btn" style="margin-bottom:20px;">+ Add stone</button>`;

  html += `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; border-color:var(--red);">
      <div style="font-weight:700; font-size:14px; color:var(--text);">Total value</div>
      <div id="sellableTotal" style="font-size:28px; font-weight:800; color:var(--red);">$0</div>
    </div>
  `;
  html += `</div>`;
  return html;
}

function computeStoneValue(stone) {
  const carats = parseFloat(stone.carats) || 0;
  const qty = parseInt(stone.qty, 10) || 1;
  let perStone;
  if (carats > RAPAPORT_THRESHOLD_CT) {
    perStone = parseFloat(stone.manualValue) || 0;
  } else {
    const points = carats * 100;
    const tierDef = DIAMOND_TIERS.find((t) => t.key === stone.tier) || DIAMOND_TIERS[1];
    perStone = points * tierDef.rate;
  }
  return perStone * qty;
}

function recomputeSellableTotals() {
  const s = state.sellable;
  let total = 0;

  if (s.metal) {
    const weightInput = document.getElementById("sellableWeight");
    const weight = parseFloat(weightInput ? weightInput.value : "0") || 0;
    const metalValue = weight * sellableRates[s.metal];
    total += metalValue;
    const out = document.getElementById("metalValue");
    if (out) out.textContent = fmt(metalValue);
  }

  s.stones.forEach((stone) => {
    const value = computeStoneValue(stone);
    total += value;
    const out = document.getElementById(`sv_${stone.id}`);
    if (out) out.textContent = fmt(value);
  });

  const totalEl = document.getElementById("sellableTotal");
  if (totalEl) totalEl.textContent = fmt(total);
}

function navbar() {

  }
  return `
    <div class="navbar">

      ${btn(ICON_DIAMOND, "Jewelry", "jewelry")}

function render() {
  let mainHtml = "";
  if (state.view === "home") mainHtml = homeScreen();
  else if (state.view === "ebay") mainHtml = ebayScreen();
  else if (state.view === "guns") mainHtml = gunsScreen();
  else if (state.view === "jewelry") {
    if (state.jewelryStep === "menu") mainHtml = jewelryMenuScreen();
    else if (state.jewelryStep === "scrap") mainHtml = scrapJewelryScreen();
    else if (state.jewelryStep === "sellable") mainHtml = sellableScreen();
    else mainHtml = comingSoonScreen("Jewelry", ICON_DIAMOND);
  }

  document.getElementById("app").innerHTML = `
    ${header()}
    <div id="main">${mainHtml}</div>
    ${navbar()}
  `;
  attachHandlers();
}

async function handleLookup() {
  if (!state.itemName.trim()) return;
  if (!state.apiUrl.trim()) {
    state.showSettings = true;
    render();
    return;
  }
  state.lookupState = "loading";
  state.compsCount = null;
  render();
  try {
    const base = state.apiUrl.replace(/\/+$/, "");
    const res = await fetch(`${base}/api/comps?q=${encodeURIComponent(state.itemName.trim())}`);
    const data = await res.json();
    if (!res.ok || data.average == null) {
      state.lookupState = "error";
      render();
      return;
    }
    state.ebayValue = String(data.average);
    state.compsCount = data.count;
    state.lookupState = "done";
  } catch (e) {
    state.lookupState = "error";
  }
  render();
}

function handlePhotoFiles(files) {
  Array.from(files).forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      state.photos.push(reader.result);
      render();
    };
    reader.readAsDataURL(file);
  });
}

function attachHandlers() {
  const goScrap = document.getElementById("goScrap");
  if (goScrap) goScrap.onclick = () => {
    state.jewelryStep = "scrap";
    if (!state.spot) {
      loadSpotPrices();
    } else {
      render();
    }
  };

  const goSellable = document.getElementById("goSellable");
  if (goSellable) goSellable.onclick = () => { state.jewelryStep = "sellable"; render(); };

  const retrySpotBtn = document.getElementById("retrySpotBtn");
  if (retrySpotBtn) retrySpotBtn.onclick = loadSpotPrices;

  const refreshSpotBtn = document.getElementById("refreshSpotBtn");
  if (refreshSpotBtn) refreshSpotBtn.onclick = loadSpotPrices;

  document.querySelectorAll(".scrapWeight").forEach((input) => {
    input.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9.]/g, "");
      if (cleaned !== e.target.value) e.target.value = cleaned;
      recomputeScrapTotals();
    };
  });

  document.querySelectorAll(".metalBtn").forEach((b) => {
    b.onclick = () => { state.sellable.metal = b.dataset.metal; render(); };
  });

  const metalSettingsBtn = document.getElementById("metalSettingsBtn");
  if (metalSettingsBtn) metalSettingsBtn.onclick = () => {
    state.showMetalSettings = !state.showMetalSettings;
    render();
  };

  const saveMetalRatesBtn = document.getElementById("saveMetalRatesBtn");
  if (saveMetalRatesBtn) saveMetalRatesBtn.onclick = () => {
    const newRates = {};
    document.querySelectorAll(".metalRateInput").forEach((input) => {
      const val = parseFloat(input.value);
      if (!isNaN(val)) newRates[input.dataset.metal] = val;
    });
    saveMetalRates(newRates);
    state.showMetalSettings = false;
    render();
  };

  const sellableWeight = document.getElementById("sellableWeight");
  if (sellableWeight) sellableWeight.oninput = (e) => {
    const cleaned = e.target.value.replace(/[^0-9.]/g, "");
    if (cleaned !== e.target.value) e.target.value = cleaned;
    state.sellable.weightDwt = cleaned;
    recomputeSellableTotals();
  };

  const addStoneBtn = document.getElementById("addStoneBtn");
  if (addStoneBtn) addStoneBtn.onclick = () => {
    state.stoneIdCounter += 1;
    state.sellable.stones.push({
      id: state.stoneIdCounter,
      carats: "",
      qty: "1",
      tier: "decent",
      manualValue: "",
    });
    render();
  };

  document.querySelectorAll("[data-remove-stone]").forEach((b) => {
    b.onclick = () => {
      const id = parseInt(b.dataset.removeStone, 10);
      state.sellable.stones = state.sellable.stones.filter((s) => s.id !== id);
      render();
    };
  });

  document.querySelectorAll(".stoneCarats").forEach((input) => {
    input.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9.]/g, "");
      if (cleaned !== e.target.value) e.target.value = cleaned;
      const id = parseInt(input.dataset.stone, 10);
      const stone = state.sellable.stones.find((s) => s.id === id);
      if (!stone) return;
      const oldMode = (parseFloat(stone.carats) || 0) > RAPAPORT_THRESHOLD_CT ? "manual" : "tier";
      const newMode = (parseFloat(cleaned) || 0) > RAPAPORT_THRESHOLD_CT ? "manual" : "tier";
      stone.carats = cleaned;
      if (oldMode !== newMode) {
        // Swaps between tier buttons and the manual-value input, so the
        // row needs to be redrawn.
        render();
      } else {
        recomputeSellableTotals();
      }
    };
  });

  document.querySelectorAll(".stoneQty").forEach((input) => {
    input.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9]/g, "");
      if (cleaned !== e.target.value) e.target.value = cleaned;
      const id = parseInt(input.dataset.stone, 10);
      const stone = state.sellable.stones.find((s) => s.id === id);
      if (stone) stone.qty = cleaned;
      recomputeSellableTotals();
    };
    input.onblur = () => render(); // refreshes the "(×N)" label once they're done typing
  });

  document.querySelectorAll(".stoneManualValue").forEach((input) => {
    input.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9.]/g, "");
      if (cleaned !== e.target.value) e.target.value = cleaned;
      const id = parseInt(input.dataset.stone, 10);
      const stone = state.sellable.stones.find((s) => s.id === id);
      if (stone) stone.manualValue = cleaned;
      recomputeSellableTotals();
    };
  });

  document.querySelectorAll(".stoneTierBtn").forEach((b) => {
    b.onclick = () => {
      const id = parseInt(b.dataset.stone, 10);
      const stone = state.sellable.stones.find((s) => s.id === id);
      if (stone) stone.tier = b.dataset.tier;
      render();
    };
  });

  document.querySelectorAll(".navbtn").forEach((b) => {
    b.onclick = () => {
      if (b.dataset.view === "ebay" && state.ebayStep === "offers") {
        resetItem();
      }
      if (b.dataset.view === "guns" && state.gunsStep === "offers") {
        resetGunItem();
      }
      if (b.dataset.view === "jewelry" && state.view === "jewelry") {
        state.jewelryStep = "menu";
      }
      state.view = b.dataset.view;
      state.showSettings = false;
      render();
    };
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => {
    if (state.view === "jewelry" && state.jewelryStep !== "menu") {
      state.jewelryStep = "menu";
    } else {
      resetItem();
      resetGunItem();
      state.view = "home";
    }
    render();
  };

  const settingsBtn = document.getElementById("settingsBtn");
  if (settingsBtn) settingsBtn.onclick = () => { state.showSettings = !state.showSettings; render(); };

  const apiUrlInput = document.getElementById("apiUrlInput");
  if (apiUrlInput) apiUrlInput.oninput = (e) => {
    state.apiUrl = e.target.value;
    localStorage.setItem("pawn_api_url", state.apiUrl);
  };

  const addPhotoBtn = document.getElementById("addPhotoBtn");
  const photoInput = document.getElementById("photoInput");
  if (addPhotoBtn && photoInput) {
    addPhotoBtn.onclick = () => photoInput.click();
    photoInput.onchange = (e) => { handlePhotoFiles(e.target.files); e.target.value = ""; };
  }
  document.querySelectorAll(".removePhoto").forEach((b) => {
    b.onclick = () => {
      state.photos.splice(parseInt(b.dataset.idx, 10), 1);
      render();
    };
  });

  const itemNameInput = document.getElementById("itemNameInput");
  if (itemNameInput) {
    itemNameInput.oninput = (e) => { state.itemName = e.target.value; };
    itemNameInput.onblur = () => render();
  }

  const notesInput = document.getElementById("notesInput");
  if (notesInput) {
    notesInput.oninput = (e) => { state.notes = e.target.value; };
  }

  const ebayValueInput = document.getElementById("ebayValueInput");
  if (ebayValueInput) {
    ebayValueInput.oninput = (e) => {
      state.ebayValue = e.target.value.replace(/[^0-9.]/g, "");
      state.lookupState = "manual";
    };
    ebayValueInput.onblur = () => render();
  }

  const lookupBtn = document.getElementById("lookupBtn");
  if (lookupBtn) lookupBtn.onclick = handleLookup;

  const retryBtn = document.getElementById("retryBtn");
  if (retryBtn) retryBtn.onclick = handleLookup;

  const refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.onclick = handleLookup;

  const getOffersBtn = document.getElementById("getOffersBtn");
  if (getOffersBtn) getOffersBtn.onclick = () => {
    const value = parseFloat(state.ebayValue) || 0;
    if (!value) return;
    state.ebayStep = "offers";
    render();
  };

  const editBtn = document.getElementById("editBtn");
  if (editBtn) editBtn.onclick = () => { state.ebayStep = "form"; render(); };

  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) saveBtn.onclick = () => {
    const value = parseFloat(state.ebayValue) || 0;
    state.history.unshift({
      itemName: state.itemName || "Untitled item",
      category: "eBay",
      ebayValue: value,
      low: value * 0.35,
      mid: value * 0.5,
      high: value * 0.7,
      date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
    });
    resetItem();
    state.view = "home";
    render();
  };

  const discardBtn = document.getElementById("discardBtn");
  if (discardBtn) discardBtn.onclick = () => { resetItem(); render(); };

  const gunItemNameInput = document.getElementById("gunItemNameInput");
  if (gunItemNameInput) {
    gunItemNameInput.oninput = (e) => { state.gunItemName = e.target.value; };
  }

  const gunNotesInput = document.getElementById("gunNotesInput");
  if (gunNotesInput) {
    gunNotesInput.oninput = (e) => { state.gunNotes = e.target.value; };
  }

  const gunRetailInput = document.getElementById("gunRetailInput");
  if (gunRetailInput) {
    gunRetailInput.oninput = (e) => {
      const cleaned = e.target.value.replace(/[^0-9.]/g, "");
      if (cleaned !== e.target.value) e.target.value = cleaned;
      state.gunRetail = cleaned;
    };
    gunRetailInput.onblur = () => render(); // refreshes the sell-price preview line
  }

  const getGunOffersBtn = document.getElementById("getGunOffersBtn");
  if (getGunOffersBtn) getGunOffersBtn.onclick = () => {
    const retail = parseFloat(state.gunRetail) || 0;
    if (!retail) return;
    state.gunsStep = "offers";
    render();
  };

  const editGunBtn = document.getElementById("editGunBtn");
  if (editGunBtn) editGunBtn.onclick = () => { state.gunsStep = "form"; render(); };

  const saveGunBtn = document.getElementById("saveGunBtn");
  if (saveGunBtn) saveGunBtn.onclick = () => {
    const retail = parseFloat(state.gunRetail) || 0;
    const sellPrice = retail * GUN_SELL_MULTIPLIER;
    state.history.unshift({
      itemName: state.gunItemName || "Untitled item",
      category: "Gun",
      ebayValue: sellPrice,
      low: sellPrice * GUN_LOW_PCT,
      mid: sellPrice * GUN_MID_PCT,
      high: sellPrice * GUN_HIGH_PCT,
      date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
    });
    resetGunItem();
    state.view = "home";
    render();
  };

  const discardGunBtn = document.getElementById("discardGunBtn");
  if (discardGunBtn) discardGunBtn.onclick = () => { resetGunItem(); render(); };
}

function resetItem() {
  state.photos = [];
  state.itemName = "";
  state.notes = "";
  state.ebayValue = "";
  state.ebayStep = "form";
  state.lookupState = "idle";
  state.compsCount = null;
}

function resetGunItem() {
  state.gunItemName = "";
  state.gunNotes = "";
  state.gunRetail = "";
  state.gunsStep = "form";
}

render();
</script>
</body>
</html>
